<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>AURA</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <img src="../../icons/icon48.png" alt="" class="app-icon" />
        <div>
          <h1>AURA</h1>
          <p id="site-label">Công cụ hỗ trợ truy cập</p>
        </div>
      </header>

      <p id="status-text" class="status" role="status" aria-live="polite">
        Đang tải cài đặt.
      </p>

      <section class="panel" aria-labelledby="visual-title">
        <h2 id="visual-title">Hiển thị</h2>
        <fieldset class="segmented">
          <legend>Tương phản</legend>
          <label><input type="radio" name="contrast-mode" value="none" /> Tắt</label>
          <label><input type="radio" name="contrast-mode" value="high" /> Cao</label>
          <label><input type="radio" name="contrast-mode" value="inverted" /> Đảo màu</label>
          <label><input type="radio" name="contrast-mode" value="grayscale" /> Xám</label>
        </fieldset>

        <label class="range-row">
          <span>Cỡ chữ <output id="font-scale-value">100%</output></span>
          <input id="font-scale" type="range" min="80" max="200" step="5" />
        </label>
        <label class="range-row">
          <span>Dòng <output id="line-height-value">1.4</output></span>
          <input id="line-height" type="range" min="1.1" max="2" step="0.1" />
        </label>
        <label class="range-row">
          <span>Giãn chữ <output id="letter-spacing-value">0px</output></span>
          <input id="letter-spacing" type="range" min="0" max="4" step="0.5" />
        </label>
      </section>

      <section class="panel grid-options" aria-labelledby="assist-title">
        <h2 id="assist-title">Trợ giúp đọc</h2>
        <label><input id="readable-font" type="checkbox" /> Font dễ đọc</label>
        <label><input id="focus-aid" type="checkbox" /> Viền focus rõ</label>
        <label><input id="reduced-motion" type="checkbox" /> Giảm chuyển động</label>
        <label><input id="reading-guide" type="checkbox" /> Thanh đọc</label>
      </section>

      <section class="panel" aria-labelledby="ai-title">
        <h2 id="ai-title">AI mô tả ảnh</h2>
        <label class="check-row">
          <input id="ai-consent" type="checkbox" />
          Tôi đồng ý gửi ảnh được chọn tới Gemini để tạo mô tả.
        </label>
        <label class="check-row">
          <input id="ai-enabled" type="checkbox" />
          Bật AI hỗ trợ ảnh
        </label>
        <label class="select-row">
          <span>Chế độ</span>
          <select id="ai-mode">
            <option value="manual">Thủ công</option>
            <option value="missing-alt-only">Ảnh thiếu mô tả</option>
            <option value="batch">Tự động theo lô nhỏ</option>
          </select>
        </label>
        <label class="select-row">
          <span>Tác vụ AI</span>
          <select id="ai-task">
            <option value="caption">Mô tả ảnh</option>
            <option value="ocr">Đọc chữ trong ảnh</option>
            <option value="objects">Liệt kê đối tượng</option>
            <option value="question">Hỏi về ảnh</option>
          </select>
        </label>
        <label class="range-row">
          <span>Câu hỏi về ảnh</span>
          <input id="ai-question" type="text" maxlength="240" placeholder="Ví dụ: Biển báo ghi gì?" />
        </label>
        <label class="range-row">
          <span>Gemini API key</span>
          <input id="ai-api-key" type="password" autocomplete="off" placeholder="Lưu cục bộ trên trình duyệt" />
        </label>
        <div class="button-row">
          <button id="describe-images" type="button">Mô tả và đọc ảnh</button>
          <button id="describe-selected" type="button">Ảnh đang chọn</button>
          <button id="clear-ai-cache" type="button">Xóa cache AI</button>
          <button id="clear-private-data" type="button" class="danger">Xóa dữ liệu AI</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="scope-title">
        <h2 id="scope-title">Phạm vi</h2>
        <label class="check-row">
          <input id="site-override" type="checkbox" />
          Chỉ áp dụng cho trang hiện tại
        </label>
        <div class="button-row">
          <button id="reset-site" type="button">Reset trang</button>
          <button id="reset-all" type="button" class="danger">Reset tất cả</button>
        </div>
      </section>

      <details class="privacy-note">
        <summary>Quyền riêng tư</summary>
        <p>
          AURA không gửi nội dung trang khi AI tắt. Khi bật AI, chỉ ảnh được xử
          lý mới gửi tới Gemini để nhận mô tả.
        </p>
      </details>
    </main>

    <script src="popup-settings.js"></script>
    <script src="popup-actions.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Accessibility Tools</title>
    <link rel="stylesheet" href="engine.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="app-header">
        <div class="header-title">
          <img src="../../icons/icon48.png" alt="" class="header-icon" />
          <div class="title-text">
            <strong>Accessibility Tools</strong>
            <span>Công cụ hỗ trợ truy cập</span>
          </div>
        </div>
        <button class="settings-btn" title="Cài đặt" aria-label="Cài đặt">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.532 1.532 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.532 1.532 0 01-.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106A1.532 1.532 0 0111.49 3.17zM10 13a3 3 0 100-6 3 3 0 000 6z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </header>

      <section class="card">
        <div class="card-header">
          <div class="card-icon" style="background-color: #e6e0ff">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="#6a11cb"
              aria-hidden="true"
            >
              <path
                d="M10 3a1 1 0 00-1 1v1a1 1 0 002 0V4a1 1 0 00-1-1zM4 10a1 1 0 01-1-1H3a1 1 0 010-2h1a1 1 0 011 1v1zM16 10a1 1 0 01-1-1V9a1 1 0 012 0v1a1 1 0 01-1 1zM10 16a1 1 0 01-1-1v-1a1 1 0 012 0v1a1 1 0 01-1 1zM7.05 7.05a1 1 0 00-1.414-1.414L4.222 7.05a1 1 0 001.414 1.414l1.414-1.414zM12.95 12.95a1 1 0 00-1.414-1.414l-1.414 1.414a1 1 0 001.414 1.414l1.414-1.414zM7.05 12.95a1 1 0 01-1.414 1.414l-1.414-1.414a1 1 0 011.414-1.414l1.414 1.414zM12.95 7.05a1 1 0 01-1.414 1.414l-1.414-1.414a1 1 0 011.414-1.414l1.414 1.414zM10 18a8 8 0 100-16 8 8 0 000 16z"
              />
            </svg>
          </div>
          <div class="card-title">
            <strong>Chế độ Tương phản</strong>
            <span>Tăng độ tương phản màu sắc</span>
          </div>
        </div>
        <div class="card-body">
          <div class="setting-row">
            <label for="contrast-toggle" class="setting-label">
              Tương phản cao
              <span>Đảo ngược màu sắc trang web</span>
            </label>
            <label class="switch">
              <input
                type="checkbox"
                id="contrast-toggle"
                aria-label="Tương phản cao"
              />
              <span class="slider-thumb"></span>
            </label>
          </div>
          <div class="info-box">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                clip-rule="evenodd"
              />
            </svg>
            <span>Áp dụng bộ lọc: invert(1) hue-rotate(180deg)</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <div class="card-icon" style="background-color: #e0f5ff">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="#007acc"
              aria-hidden="true"
            >
              <path
                d="M10.75 4.75a.75.75 0 00-1.5 0v2.5h-2.5a.75.75 0 000 1.5h2.5v2.5a.75.75 0 001.5 0v-2.5h2.5a.75.75 0 000-1.5h-2.5v-2.5z"
              />
              <path
                d="M2 10a8 8 0 1116 0 8 8 0 01-16 0zM1.5 10a8.5 8.5 0 1017 0 8.5 8.5 0 00-17 0z"
              />
              <path d="M12.5 10a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z" />
            </svg>
          </div>
          <div class="card-title">
            <strong>Điều chỉnh Phóng chữ</strong>
            <span>Thay đổi kích thước văn bản</span>
          </div>
        </div>
        <div class="card-body">
          <div class="setting-row">
            <label class="setting-label">Kích thước phóng chữ</label>
            <span id="font-size-value" class="font-value">100%</span>
          </div>
          <div class="slider-container">
            <input
              type="range"
              id="font-slider"
              min="80"
              max="200"
              value="100"
              aria-label="Kích thước phóng chữ"
            />
            <div class="slider-labels">
              <span>A 80%</span>
              <span>A 200%</span>
            </div>
          </div>
          <p id="preview-text" class="preview-text" aria-live="polite">
            Đây là văn bản mẫu để xem trước thay đổi kích thước phóng chữ của
            bạn.
          </p>
        </div>
      </section>

      <footer class="app-footer">
        <div class="status">
          <span class="status-dot"></span> Đang hoạt động
        </div>
        <a href="#" class="help-link" onclick="return false">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z"
              clip-rule="evenodd"
            />
          </svg>
          Trợ giúp
        </a>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
